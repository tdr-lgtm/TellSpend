server {
    listen 80;
    root /usr/share/nginx/html;

    # Built files have a hash in their name: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the app (same as vercel.json), so a
    # refresh on /settings still loads index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
