# CI: on every push and pull request, test the backend (against a real
# PostgreSQL) and the frontend, and check both Docker images build.
# CD: on main, once everything passes, publish the images to GitHub's
# container registry and deploy (Render + Vercel), if their hooks are set.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tellspend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellspend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Tests use DATABASE_URL + "_test"; migrations are checked on the main one.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tellspend
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      EMAIL_BACKEND: console
      # No LLM_MODEL: tests that call the real AI skip, so CI costs nothing.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - name: Create the test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE tellspend_test"
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: tellspend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Pushed only from main; pull requests just check that it builds.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deploy hooks are secret URLs: Render > service > Settings > Deploy Hook,
      # Vercel > project > Settings > Git > Deploy Hooks. A missing one is skipped.
      - name: Deploy the API (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy started"
      - name: Deploy the web app (Vercel)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_URL not set, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel deploy started"
